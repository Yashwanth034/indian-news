name: telegram publish

on:
  schedule:
    # Every 15 minutes: collect, run the India pipeline, publish.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent article-extraction cache
        # data/news.db holds the ArticleCache used by
        # telebuild's best-effort article enrichment (48h TTL).
        # A per-run cache key with a prefix restore-key carries
        # the latest database forward without committing it to
        # git.
        uses: actions/cache@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Create data directory
        run: mkdir -p data

      - name: Collect fresh news
        # Runs the India pipeline and writes
        # data/telegram_queue.json in this workspace, so every
        # cycle publishes a fresh queue.
        run: |
          python -m src.main

      - name: Publish telegram messages
        run: |
          python -m src.telegram_run --yes
        env:
          TELEGRAM_PUBLISH: "1"

      - name: Commit queue and state
        # KNOWN PRODUCTION CAVEAT (at-least-once): queue and
        # state are committed only after publishing. If this job
        # fails between a successful send and this commit/push,
        # the next run starts from the previous state and may
        # re-publish one already-sent story. Accepted for now; a
        # dedup/ack redesign is intentionally deferred.
        run: |
          if git diff --quiet -- data/telegram_queue.json data/telegram_state.json; then
            echo "no state changes"
          else
            git config user.name "telegram-bot"
            git config user.email "telegram-bot@localhost"
            git add data/telegram_queue.json data/telegram_state.json
            git commit -m "telegram queue+state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin main
          fi