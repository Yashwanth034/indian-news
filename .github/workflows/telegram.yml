name: telegram publish

on:
  workflow_dispatch:

concurrency:
  group: telegram-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent article-extraction cache
        uses: actions/cache@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Create data directory
        run: mkdir -p data

      - name: Collect fresh news
        run: |
          python -m src.main

      - name: Publish telegram messages
        run: |
          python -m src.telegram_run --yes
        env:
          TELEGRAM_PUBLISH: "1"

      - name: Commit queue and state
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all \
            -- data/telegram_queue.json data/telegram_state.json)" ]; then

            echo "state changes detected"

            git config user.name "telegram-bot"
            git config user.email "telegram-bot@localhost"

            git add data/telegram_queue.json data/telegram_state.json

            git commit -m "telegram queue+state: $(date -u +%Y-%m-%dT%H:%MZ)"

            git pull --rebase origin main

            git push origin main
          else
            echo "no state changes"
          fi
